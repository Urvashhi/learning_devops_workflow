name: Laravel Deploy

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read
      
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::215213927293:role/GitHubActionsSSMRole
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get EC2 Instances from ASG
        id: instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ secrets.ASG_NAME }}" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          echo "INSTANCE_IDS=$INSTANCE_IDS" >> $GITHUB_ENV
          echo "Instances: $INSTANCE_IDS"

      
      - name: Deploy Laravel via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "Laravel Deployment" \
            --parameters 'commands=[
              "cd /var/www/learning_devops_workflow",
              "git config --global --add safe.directory /var/www/learning_devops_workflow",
              "git fetch origin",
              "git reset --hard origin/master",
              "composer install --no-dev --optimize-autoloader",
              "php artisan migrate --force",
              "php artisan optimize:clear",
              "php artisan config:cache",
              "php artisan route:cache",
              "php artisan view:cache",
              "sudo systemctl restart apache2"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          echo "Command ID: $COMMAND_ID"

      # - name: Run ls command via SSM
      #   run: |
      #     COMMAND_ID=$(aws ssm send-command \
      #       --instance-ids $INSTANCE_IDS \
      #       --document-name "AWS-RunShellScript" \
      #       --comment "Test SSM" \
      #       --parameters commands='[
      #         "pwd",
      #         "whoami",
      #         "cd /var/www/learning_devops_workflow",
      #         "pwd",
      #         "whoami",
      #         "ls -l"
      #       ]' \
      #       --query "Command.CommandId" \
      #       --output text)

      #     echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
      #     echo "Command ID: $COMMAND_ID"

      - name: Wait for SSM
        run: sleep 20

      - name: Check SSM Status
        run: |
          aws ssm list-command-invocations \
            --command-id $COMMAND_ID \
            --details

      - name: Show Output
        run: |
          for INSTANCE in $INSTANCE_IDS
          do
            echo "===== $INSTANCE ====="

            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id $INSTANCE

          done