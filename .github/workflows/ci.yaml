name: Laravel Code Quality

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          coverage: none

      - run: composer validate

      - run: composer install --no-interaction --prefer-dist

      - name: Install Reviewdog
        uses: reviewdog/action-setup@v1

      - name: Laravel Pint
        run: |
          ./vendor/bin/pint --test --format=checkstyle > pint.xml || true

      - name: Reviewdog Pint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog \
            -f=checkstyle \
            -name="Laravel Pint" \
            -reporter=github-pr-review \
            -level=warning \
            < pint.xml

      - name: PHPStan
        run: |
          ./vendor/bin/phpstan analyse --error-format=checkstyle > phpstan.xml || true

      - name: Reviewdog PHPStan
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog \
            -f=checkstyle \
            -name="PHPStan" \
            -reporter=github-pr-review \
            -level=error \
            < phpstan.xml

      - name: PHPUnit
        run: php artisan test

      - name: Composer Audit
        run: composer audit